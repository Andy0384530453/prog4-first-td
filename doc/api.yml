openapi: 3.0.3
info:
  title: BookStore API
  description: API for bookstore management featuring OpenLibrary integration for automated book data retrieval.
  version: 1.0.0
servers:
  - url: http://localhost:8080/api
    description: Development server

tags:
  - name: Books
    description: Book inventory and analytics
  - name: Sales
    description: Customer purchases and billing
  - name: Customers
    description: Customer profile management

paths:
  /books:
    get:
      summary: List all books
      tags:
        - Books
      description: Returns a complete list of books with optional filtering by genre.
      parameters:
        - name: genre
          in: query
          description: Filter books by genre
          required: false
          schema:
            type: string
      responses:
        '200':
          description: List of books retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDetail'
        '400':
          description: Bad request
    post:
      summary: Add a new book
      tags:
        - Books
      description: Receives an ISBN and prices, fetches missing data from OpenLibrary, and creates a database record.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '400':
          description: Invalid data or ISBN not found on OpenLibrary

  /books/top-profit:
    get:
      summary: List most profitable books
      tags:
        - Books
      description: Returns books sorted by total profit descending, calculated as (selling_price - purchase_price) * quantity_sold.
      responses:
        '200':
          description: Ranking of the most profitable books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookProfitDetail'

  /books/low-stock:
    get:
      summary: List low stock books
      tags:
        - Books
      description: Returns books with a current stock level less than or equal to 3.
      responses:
        '200':
          description: List of books requiring replenishment
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookDetail'

  /sales:
    post:
      summary: Register a sale
      tags:
        - Sales
      description: Creates a new transaction record, links books with purchased quantities, and updates inventory stock.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleInput'
      responses:
        '201':
          description: Sale registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        '400':
          description: Invalid sale data or insufficient stock

  /sales/{id}:
    get:
      summary: Get sale details
      tags:
        - Sales
      description: Returns full transaction details based on a unique sale identifier.
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the sale
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sale details found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SaleDetail'
        '404':
          description: Sale not found

  /customers:
    get:
      summary: List all customers
      tags:
        - Customers
      description: Returns a complete list of registered customer accounts.
      responses:
        '200':
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomerDetail'
    post:
      summary: Create a customer profile
      tags:
        - Customers
      description: Adds a new customer profile to the database.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerInput'
      responses:
        '201':
          description: Customer profile created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerDetail'
        '400':
          description: Invalid customer data

components:
  schemas:
    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: Explicit error message payload


    AuthorDetail:
      type: object
      required:
        - id_author
        - last_name
        - first_name
      properties:
        id_author:
          type: string
          format: uuid
        last_name:
          type: string
        first_name:
          type: string


    BookInput:
      type: object
      required:
        - isbn
        - purchase_price
        - selling_price
        - category
      properties:
        isbn:
          type: string
        purchase_price:
          type: number
          format: float
        selling_price:
          type: number
          format: float
        category:
          $ref: '#/components/schemas/CategoryDetail'

    BookDetail:
      type: object
      required:
        - isbn
        - title
        - genre
        - purchase_price
        - selling_price
        - current_stock
        - category
      properties:
        isbn:
          type: string
        title:
          type: string
        genre:
          type: string
        publication_date:
          type: string
          format: date
        purchase_price:
          type: number
          format: float
        selling_price:
          type: number
          format: float
        current_stock:
          type: integer
        category:
          $ref: '#/components/schemas/CategoryDetail'
        authors:
          type: array
          items:
            $ref: '#/components/schemas/AuthorDetail'

    BookProfitDetail:
      allOf:
        - $ref: '#/components/schemas/BookDetail'
        - type: object
          properties:
            total_profit:
              type: number
              format: float


    CustomerInput:
      type: object
      required:
        - first_name
        - last_name
      properties:
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email

    CustomerDetail:
      type: object
      required:
        - id_customer
        - first_name
        - last_name
      properties:
        id_customer:
          type: string
          format: uuid
        first_name:
          type: string
        last_name:
          type: string
        phone_number:
          type: string
        email:
          type: string
          format: email


    CategoryDetail:
      type: object
      required:
        - id_category
        - category_name
      properties:
        id_category:
          type: string
          format: uuid
        category_name:
          type: string
          enum: [LARGE, MEDIUM, SMALL]


    BookQuantityReference:
      type: object
      required:
        - isbn
        - quantity
      properties:
        isbn:
          type: string
        quantity:
          type: integer


    SaleInput:
      type: object
      required:
        - customer_id
        - books
      properties:
        customer_id:
          type: string
          format: uuid
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookQuantityReference'

    SaleDetail:
      type: object
      required:
        - id_sale
        - sale_date
        - payment_status
        - books
      properties:
        id_sale:
          type: string
          format: uuid
        sale_date:
          type: string
          format: date-time
        payment_status:
          type: string
          enum: [PENDING, PAID, CANCELLED]
        customer:
          $ref: '#/components/schemas/CustomerDetail'
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookQuantityReference'


    StockHistoryDetail:
      type: object
      required:
        - id_stock
        - isbn
        - movement_type
        - movement_date
        - quantity
        - reason
      properties:
        id_stock:
          type: string
          format: uuid
        isbn:
          type: string
        movement_type:
          type: string
          enum: [IN, OUT]
        movement_date:
          type: string
          format: date-time
        quantity:
          type: integer
        sale_id:
          type: string
          format: uuid
          nullable: true
        reason:
          type: string